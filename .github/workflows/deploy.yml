name: Build & Deploy

# Rebuilds the site (pulling latest posts from Ghost) and deploys to S3 +
# CloudFront. Runs on:
#   - push to main          → deploy code changes
#   - hourly schedule       → pick up newly published Ghost posts
#   - manual "Run workflow"  → publish on demand (Aiden can use this)
#   - repository_dispatch    → instant publish via the Ghost webhook relay
#                              (see infra/ghost-webhook-relay/)
on:
  push:
    branches: [main]
  schedule:
    # Once a day at 3pm PST (23:00 UTC). Cron runs in UTC and does NOT shift for
    # daylight saving, so during PDT (Mar–Nov) this effectively fires at 4pm Pacific.
    - cron: "0 23 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [ghost-publish]

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: us-west-2
      S3_BUCKET: aveniradmissions.com
      CF_DISTRIBUTION_ID: EKGCNH4EYL9W1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fetches posts from Ghost, builds, and prerenders (see package.json).
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/*"
